[package]
org = "hacker-house-medellin"
name = "hhm-flutter"
version = "0.1.0"
description = "HHM mobile, desktop, and web applications built with Flutter"
license = "MIT"
keywords = ["flutter", "mobile", "desktop", "presence", "visitors"]

[package.repository]
vcs = "git"
url = "https://github.com/hacker-house-medellin/hhm-flutter"

[install]
dir = ".vendor/.zed"

[dependencies]
"hacker-house-medellin/hhm-clients" = "^0.1.0"
"hacker-house-medellin/hhm-interfaces" = "^0.1.0"
"hacker-house-medellin/hhm-sync" = "^0.1.0"
"shared-auth/shared-auth-clients" = "^0.1.0"
"oresoftware/ores-flutter" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "env/dec/**", "build/**", ".dart_tool/**", ".vendor/.zed/**", "*.log"]

[scripts]
test = "flutter test"

[targets.dart]
dir = "."
name = "hhm-flutter"
adapter = "dart"
